name: Backend

on:
  push:
    branches: [main]
    paths: [backend/**, .github/workflows/backend.yml]
  pull_request:
    paths: [backend/**, .github/workflows/backend.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Lint (ruff check)", run: "uv run ruff check ." }
          - {
              name: "Formato (ruff format)",
              run: "uv run ruff format --check .",
            }
          - { name: "Tipos (pyright)", run: "uv run pyright" }
          - {
              name: "Tests unitarios y cobertura (pytest)",
              run: "uv run pytest --cov=app --cov-report=term-missing",
            }
          - { name: "Build del paquete (uv build)", run: "uv build" }
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --locked
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
